version: '3.8'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./monitor.db
      - ALLOWED_ORIGINS=*
      - N8N_BASE_URL=http://192.168.1.99:5678
      - N8N_API_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiMzljNTkwNy03ZTJmLTQxZjItODQ4MS0yNDcxZjA3MGZkNGQiLCJpc3MiOiJuOG4iLCJhdWQiOiJwdWJsaWMtYXBpIiwiaWF0IjoxNzY4NTc1NzM3fQ.g6QE5DkdGSlxefaYwc1wDQ8Gdo6KKClCJllM0lPE5v4
      - DATABASE_PATH=/app/data/monitor.db
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app # Keep source code mounted for fast fixes
      # Mount systemd socket to control host services
      - /run/systemd/system:/run/systemd/system
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true # Required for systemd control

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=/ws

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

networks:
  default:
    driver: bridge
